<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>计划产物渲染器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f5;
      --surface: #fffefb;
      --surface-2: #eef3ea;
      --ink: #202421;
      --muted: #626a64;
      --line: #dbe2d7;
      --shadow: 0 18px 42px rgba(24, 31, 27, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    header {
      margin-bottom: 16px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 6px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    header p {
      margin-bottom: 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 260px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      padding: 12px;
      line-height: 1.5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    iframe {
      width: 100%;
      min-height: 680px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .markdown-preview {
      min-height: 680px;
      max-height: 900px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      padding: 18px;
    }

    .markdown-preview h1,
    .markdown-preview h2,
    .markdown-preview h3 {
      line-height: 1.18;
      margin: 18px 0 8px;
    }

    .markdown-preview h1 { font-size: 28px; }
    .markdown-preview h2 { font-size: 21px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
    .markdown-preview h3 { font-size: 17px; }
    .markdown-preview p { margin: 8px 0; }
    .markdown-preview ul,
    .markdown-preview ol { margin: 8px 0 12px; padding-left: 22px; }
    .markdown-preview pre {
      overflow: auto;
      background: var(--surface-2);
      border-radius: 8px;
      padding: 12px;
    }
    .markdown-preview code {
      background: var(--surface-2);
      border-radius: 5px;
      padding: 1px 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .empty {
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>计划产物渲染器</h1>
      <p>粘贴 <code>plan-review.html</code> 和 <code>plan-review.md</code>，左边编辑，右边预览。规则和项目地图放在 Markdown 文档里维护。</p>
    </header>

    <section class="grid">
      <div class="stack">
        <article class="panel">
          <h2>plan-review.html</h2>
          <textarea id="htmlInput" placeholder="把 agent 生成的 plan-review.html 粘贴到这里。"></textarea>
        </article>
        <article class="panel">
          <h2>plan-review.md</h2>
          <textarea id="markdownInput" placeholder="把 agent 生成的 plan-review.md 粘贴到这里。"></textarea>
        </article>
      </div>

      <div class="stack">
        <article class="panel">
          <h2>HTML 预览</h2>
          <iframe id="htmlPreview" title="HTML plan preview" sandbox=""></iframe>
        </article>
        <article class="panel">
          <h2>Markdown 预览</h2>
          <div id="markdownPreview" class="markdown-preview"></div>
        </article>
      </div>
    </section>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/\`([^\`]+)\`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderMarkdown(markdown) {
      const lines = String(markdown || "").split("\n");
      const html = [];
      let listTag = "";
      let inCode = false;
      let codeLines = [];

      function closeList() {
        if (listTag) {
          html.push("</" + listTag + ">");
          listTag = "";
        }
      }

      function closeCode() {
        if (inCode) {
          html.push("<pre><code>" + escapeHtml(codeLines.join("\n")) + "</code></pre>");
          codeLines = [];
          inCode = false;
        }
      }

      for (const line of lines) {
        if (line.startsWith("~~~") || line.startsWith(String.fromCharCode(96, 96, 96))) {
          if (inCode) {
            closeCode();
          } else {
            closeList();
            inCode = true;
            codeLines = [];
          }
          continue;
        }

        if (inCode) {
          codeLines.push(line);
          continue;
        }

        if (/^###\s+/.test(line)) {
          closeList();
          html.push("<h3>" + inlineMarkdown(line.replace(/^###\s+/, "")) + "</h3>");
          continue;
        }

        if (/^##\s+/.test(line)) {
          closeList();
          html.push("<h2>" + inlineMarkdown(line.replace(/^##\s+/, "")) + "</h2>");
          continue;
        }

        if (/^#\s+/.test(line)) {
          closeList();
          html.push("<h1>" + inlineMarkdown(line.replace(/^#\s+/, "")) + "</h1>");
          continue;
        }

        if (/^\s*[-*]\s+/.test(line)) {
          if (listTag !== "ul") {
            closeList();
            html.push("<ul>");
            listTag = "ul";
          }
          html.push("<li>" + inlineMarkdown(line.replace(/^\s*[-*]\s+/, "")) + "</li>");
          continue;
        }

        if (/^\s*\d+\.\s+/.test(line)) {
          if (listTag !== "ol") {
            closeList();
            html.push("<ol>");
            listTag = "ol";
          }
          html.push("<li>" + inlineMarkdown(line.replace(/^\s*\d+\.\s+/, "")) + "</li>");
          continue;
        }

        if (!line.trim()) {
          closeList();
          continue;
        }

        closeList();
        html.push("<p>" + inlineMarkdown(line) + "</p>");
      }

      closeCode();
      closeList();
      return html.join("\n") || '<p class="empty">还没有 Markdown artifact。</p>';
    }

    function render() {
      $("#htmlPreview").srcdoc = $("#htmlInput").value.trim() || '<!doctype html><meta charset="utf-8"><body style="font:16px system-ui;padding:24px;color:#626a64">还没有 HTML artifact。</body>';
      $("#markdownPreview").innerHTML = renderMarkdown($("#markdownInput").value);
    }

    $("#htmlInput").addEventListener("input", render);
    $("#markdownInput").addEventListener("input", render);
    render();
  </script>
</body>
</html>
